name: Keep Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake penangdriver server
        run: |
          curl -fsS https://penangdriver.onrender.com/health
          curl -fsS -o /dev/null -w "Ridenow: %{http_code}\n" https://penangdriver.onrender.com/Ridenow
