name: Keep Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake penangdriver
        run: curl -fsS https://penangdriver.onrender.com/health || true
      - name: Wake malaysia (public)
        run: curl -fsS https://malaysia-ewfn.onrender.com/health || true
